<!DOCTYPE html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verdensreisen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>/* Verdensreisen. Layout: én smal kolonne (mobil først), kort på fargerik himmel, nedre fane-linje. */
:root{--sky1:#2aa4f4;--sky2:#1457c8;--ink:#1d2a57;--ink2:#53618f;--card:#fff;--soft:#eef5ff;--line:#d3e2fb;
--cta:#ffc21a;--cta-d:#d49300;--cta-ink:#3a2700;--ok:#1f9d57;--ok-d:#157a42;--ok-bg:#e1f7e9;--bad:#e5533d;--bad-d:#b43a27;--bad-bg:#ffe8e3;
--brand:#3b6cf5;--brand-d:#274fc4;--on:#fff;--r:22px;
--fd:"Baloo 2","Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;--fb:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;
--bronze:#cd7f32;--silver:#9aa7bd;--gold:#f2b705}
html[data-skin=regn]{--sky1:#35cf84;--sky2:#0b7653;--brand:#119b68;--brand-d:#0a7550}
html[data-skin=sol]{--sky1:#ff9b5e;--sky2:#c8325f;--brand:#e0503f;--brand-d:#b23527}
html[data-skin=rom]{--sky1:#6b5dff;--sky2:#1b1357;--brand:#6a5cff;--brand-d:#4337c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);font-size:17px;line-height:1.35;color:var(--ink);color-scheme:light;
background:var(--sky2) linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
background:radial-gradient(circle at 12% 14%,#fff 0 6px,transparent 7px),radial-gradient(circle at 82% 9%,#fff 0 4px,transparent 5px),radial-gradient(circle at 70% 40%,#fff 0 3px,transparent 4px),radial-gradient(circle at 22% 62%,#fff 0 4px,transparent 5px),radial-gradient(circle at 90% 78%,#fff 0 6px,transparent 7px),radial-gradient(circle at 40% 92%,#fff 0 3px,transparent 4px)}
#app{position:relative;max-width:640px;margin:0 auto;min-height:100vh;padding:14px 16px calc(104px + env(safe-area-inset-bottom))}
#app.nonav{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.1}
h1{font-size:2.3rem;font-weight:800}h2{font-size:1.6rem;font-weight:800}h3{font-size:1.2rem;font-weight:700}
.on{color:var(--on);text-shadow:0 2px 0 rgba(0,0,0,.18)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 6px 0 rgba(10,30,90,.18),0 14px 28px rgba(10,30,90,.14)}
.card.soft{background:var(--soft);box-shadow:none}
.btn{font-family:var(--fd);font-weight:800;font-size:1.25rem;border:0;border-radius:18px;padding:12px 22px;min-height:58px;cursor:pointer;
background:var(--cta);color:var(--cta-ink);box-shadow:0 6px 0 var(--cta-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cta-d)}
.btn.sec{background:#fff;color:var(--brand-d);box-shadow:0 6px 0 #b4c9f3}
.btn.sec:active{box-shadow:0 2px 0 #b4c9f3}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 6px 0 var(--ok-d)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 6px 0 var(--bad-d)}
.btn.big{min-height:72px;font-size:1.6rem;border-radius:22px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:46px;font-size:1rem;padding:8px 14px;border-radius:14px;box-shadow:0 4px 0 var(--cta-d)}
.btn.sec.sm{box-shadow:0 4px 0 #b4c9f3}
.icon-btn{width:52px;height:52px;border-radius:16px;border:0;background:#fff;color:var(--brand-d);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 #b4c9f3;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4c9f3}
.ic{width:26px;height:26px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-family:var(--fd);font-size:1.05rem;box-shadow:0 3px 0 rgba(10,30,90,.16)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;color:var(--brand-d)}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.center{text-align:center}
/* topbar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h2{flex:1;color:var(--on);text-shadow:0 2px 0 rgba(0,0,0,.18)}
/* home */
.me{display:flex;align-items:center;gap:12px}
.avatar{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2rem;box-shadow:0 4px 0 rgba(10,30,90,.2);flex:none}
.xpbar{height:14px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe36b,#ffb800);border-radius:99px;transition:width .6s}
.hero{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.bubble{position:relative;background:#fff;border-radius:20px;padding:12px 16px;font-weight:800;box-shadow:0 5px 0 rgba(10,30,90,.16);margin-bottom:34px;flex:1}
.bubble::after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.pippa{width:128px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.meter{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.mystery{display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;border:0;text-align:left;background:#fff}
.flagbox{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#e9eef9;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(29,42,87,.12)}
.flagbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.flagbox.mini{width:84px;flex:none;border-radius:8px}
.flagbox.blur img{filter:blur(10px) saturate(.4)}
/* setup */
.dots{display:flex;gap:8px;justify-content:center;margin:2px 0 14px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff;width:34px;border-radius:99px}
.pick{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:0;background:#fff;border-radius:20px;padding:14px 16px;min-height:84px;cursor:pointer;box-shadow:0 6px 0 rgba(10,30,90,.18);font-family:var(--fd)}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(10,30,90,.18)}
.pick .em{font-size:2.3rem;width:56px;text-align:center;flex:none}
.pick b{display:block;font-size:1.35rem}
.pick span.d{display:block;font-family:var(--fb);font-weight:700;font-size:.95rem;color:var(--ink2);line-height:1.25}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick.v{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:16px 8px}
/* game */
.prog{position:relative;flex:1;height:22px;border-radius:99px;background:rgba(255,255,255,.35)}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#9cf0b5,#32c36c);transition:width .4s}
.prog b{position:absolute;top:-6px;transform:translateX(-50%);font-size:1.4rem;transition:left .4s}
.combo{font-family:var(--fd);font-weight:800;background:#fff;border-radius:99px;padding:4px 12px;min-width:64px;text-align:center;color:#d4570a}
.qcard{text-align:center}
.qlab{font-family:var(--fd);font-weight:800;font-size:1.35rem;line-height:1.15;margin-bottom:12px}
.qbig{font-family:var(--fd);font-weight:800;font-size:2.1rem;line-height:1.1;padding:8px 0;color:var(--brand-d);overflow-wrap:anywhere}
.qcard .flagbox{max-width:340px;margin:0 auto}
.retry{display:inline-block;background:#fff3c4;color:#7a5600;font-weight:800;border-radius:99px;padding:2px 12px;font-size:.85rem;margin-bottom:8px}
.opts{display:grid;gap:12px;margin-top:16px}
.opts.f{grid-template-columns:1fr 1fr}
.opt{position:relative;border:0;background:#fff;border-radius:18px;min-height:62px;padding:12px 14px;font-family:var(--fd);font-weight:700;font-size:1.3rem;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #b4c9f3;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;overflow-wrap:anywhere}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #b4c9f3}
.opts.f .opt{padding:8px;min-height:0}
.opt .k{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--ink2);font-size:.85rem;display:grid;place-items:center}
.opts.f .opt .k{left:12px;top:12px;transform:none;background:rgba(255,255,255,.9)}
.opt.ok{background:var(--ok-bg);box-shadow:0 5px 0 var(--ok);outline:4px solid var(--ok)}
.opt.bad{background:var(--bad-bg);box-shadow:0 5px 0 var(--bad);outline:4px solid var(--bad)}
.opt.gone{opacity:.25;pointer-events:none}
.opt.dim{opacity:.55}
.opt .mk{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:1.3rem}
.opts.f .opt .mk{top:12px;right:12px;transform:none;background:#fff;border-radius:50%;width:30px;height:30px;place-items:center}
.opt.ok .mk,.opt.bad .mk{display:grid}
.opt.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.typed{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.typed input{font:800 1.6rem var(--fd);padding:14px 16px;border:4px solid var(--line);border-radius:18px;width:100%;color:var(--ink);background:#fff;text-align:center}
.typed input:focus{border-color:var(--brand);outline:none}
.typed input.bad{border-color:var(--bad);background:var(--bad-bg)}
.typed input.ok{border-color:var(--ok);background:var(--ok-bg)}
.hinttxt{font-family:var(--fd);font-weight:800;font-size:1.6rem;letter-spacing:.18em;color:var(--brand-d);text-align:center;min-height:1.6em}
.tools{display:flex;justify-content:center;margin-top:16px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet>div{width:100%;max-width:640px;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(10,30,90,.3)}
.sheet.ok>div{background:var(--ok-bg);color:#0d4d28}
.sheet.bad>div{background:var(--bad-bg);color:#7b2316}
.sheet h3{font-size:1.5rem}
.sheet .fact{background:rgba(255,255,255,.75);border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:700;font-size:.98rem}
.sheet .ans{font-weight:800;font-size:1.1rem}
.sheet .row{align-items:flex-start}
.sheet .mini-pip{width:64px;flex:none}
body.sheetOpen #app{padding-bottom:300px}
/* result */
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:78px;height:78px}
.stars svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--soft);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:1.7rem}
.banner{background:linear-gradient(90deg,#ffe36b,#ffb800);color:#4a3200;border-radius:16px;padding:12px 14px;font-family:var(--fd);font-weight:800;font-size:1.15rem;text-align:center}
.flagrow{display:flex;flex-wrap:wrap;gap:10px}
.mini-c{display:flex;gap:10px;align-items:center;width:100%;border:0;background:var(--soft);border-radius:14px;padding:8px;cursor:pointer;text-align:left}
.mini-c b{display:block;font-family:var(--fd);font-size:1.1rem;line-height:1.1}
/* passport */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tab{flex:none;border:0;border-radius:99px;padding:8px 14px;font-family:var(--fd);font-weight:800;font-size:1rem;background:rgba(255,255,255,.3);color:#fff;cursor:pointer}
.tab.on{background:#fff;color:var(--brand-d)}
.search{width:100%;padding:12px 16px;border-radius:16px;border:0;font:700 1.05rem var(--fb);margin-bottom:12px;box-shadow:0 4px 0 rgba(10,30,90,.16)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.cell{position:relative;border:0;background:#fff;border-radius:18px;padding:8px 8px 10px;text-align:center;cursor:pointer;box-shadow:0 5px 0 rgba(10,30,90,.16)}
.cell .nm{font-family:var(--fd);font-weight:700;font-size:.98rem;line-height:1.05;margin-top:7px;min-height:2.1em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.cell.t1{box-shadow:0 5px 0 var(--bronze)}.cell.t2{box-shadow:0 5px 0 var(--silver)}.cell.t3{box-shadow:0 5px 0 var(--gold),0 0 0 3px #ffe37a}
.cell.t0 .flagbox{filter:grayscale(1) opacity(.55)}
.cell.t0.seen .flagbox{filter:grayscale(.6)}
.pips{display:flex;gap:4px;justify-content:center;align-items:center;font-size:.72rem;font-weight:800;color:var(--ink2)}
.pip{display:inline-flex;gap:2px}.pip i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pip i.f{background:var(--ok)}
.stamp{position:absolute;right:-4px;top:-8px;width:34px;height:34px;transform:rotate(14deg)}
.q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:2rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
/* badges */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bd{text-align:center;padding:14px 10px}
.bd .em{font-size:2.6rem;line-height:1}
.bd b{display:block;font-family:var(--fd);font-size:1.1rem;margin-top:6px}
.bd.lock{opacity:.6}.bd.lock .em{filter:grayscale(1)}
/* shop */
.shopg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.si{text-align:center;padding:12px 6px;border:0;border-radius:18px;background:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(10,30,90,.16);font-family:var(--fd);font-weight:800}
.si .em{font-size:2.4rem;display:block}
.si.sel{outline:4px solid var(--ok)}
.si small{display:block;font-family:var(--fb);font-weight:800;color:var(--ink2);font-size:.85rem;margin-top:2px}
.skin{height:46px;border-radius:12px;margin-bottom:6px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.nav>div{display:flex;gap:6px;width:100%;max-width:616px;background:#fff;border-radius:24px;padding:6px;box-shadow:0 -2px 0 rgba(10,30,90,.06),0 8px 26px rgba(10,30,90,.3)}
.nav button{flex:1;border:0;background:none;border-radius:18px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 .8rem var(--fd);color:var(--ink2);cursor:pointer;min-height:58px}
.nav button.on{background:var(--soft);color:var(--brand-d)}
/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(14,24,60,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal>div{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.modal.mid{align-items:center;padding:16px}.modal.mid>div{border-radius:26px;max-width:460px}
.bigflag{max-width:380px;margin:0 auto}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:50;background:#fff;border-radius:18px;padding:10px 16px;font-family:var(--fd);font-weight:800;box-shadow:0 8px 24px rgba(10,30,90,.3);animation:drop .35s cubic-bezier(.3,1.5,.5,1);max-width:92vw;text-align:center}
@keyframes drop{from{transform:translate(-50%,-80px)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:var(--soft);border-radius:16px;padding:12px 14px;font:800 1.05rem var(--fb);cursor:pointer;min-height:56px}
.switch i{width:54px;height:30px;border-radius:99px;background:#c4cfe6;position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-pressed=true] i{background:var(--ok)}.switch[aria-pressed=true] i::after{left:27px}
input.txt{width:100%;font:800 1.3rem var(--fd);padding:12px 14px;border:4px solid var(--line);border-radius:16px;color:var(--ink)}
input.txt:focus{border-color:var(--brand);outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.opt{font-size:1.1rem}.qbig{font-size:1.7rem}.pippa{width:100px}}
</style></head>

const TY={flag:{show:'flag',opt:'name',skill:'f'},flagrev:{show:'name',opt:'flag',skill:'f'},cap:{show:'name',opt:'cap',skill:'c'},caprev:{show:'cap',opt:'name',skill:'c'},flagcap:{show:'flag',opt:'cap',skill:'c'},

const DIFF={lett:{n:'Lett',e:'🌱',cap:1,nopt:3,d:'De mest kjente landene, 3 svar å velge mellom'},middels:{n:'Middels',e:'🌿',cap:2,nopt:4,d:'Flere land, 4 svar og litt like svaralternativer'},vanskelig:{n:'Vanskelig',e:'🌳',cap:3,nopt:6,d:'Alle land, 6 svar og flagg som ligner'},mester:{n:'Mester',e:'🏆',cap:3,nopt:0,d:'Alle land. Du skriver svaret selv!'}};
const TOPICS={flagg:{n:'Flagg',e:'🏳️‍🌈',d:'Hvilket land har dette flagget?'},hoved:{n:'Hovedsteder',e:'🏛️',d:'Hva heter hovedstaden?'},mix:{n:'Alt i ett',e:'🎲',d:'Flagg, land og hovedsteder om hverandre'}};
function qTypes(topic,diff){
  if(diff==='mester')return{flagg:['tflag'],hoved:['tcap','tcaprev'],mix:['tflag','tcap','tcaprev','tflagcap']}[topic];
  if(topic==='flagg')return diff==='lett'?['flag']:['flag','flagrev'];
  if(topic==='hoved')return diff==='lett'?['cap']:['cap','caprev'];
  return diff==='lett'?['flag','cap']:diff==='middels'?['flag','flagrev','cap','caprev']:['flag','flagrev','cap','caprev','flagcap'];
}
function prepCfg(topic,diff,region){
  const D=DIFF[diff];let cap=D.cap;const inR=c=>region==='ALL'||c.cont===region;
  let pool=C.filter(c=>inR(c)&&c.tier<=cap);while(pool.length<12&&cap<3){cap++;pool=C.filter(c=>inR(c)&&c.tier<=cap)}
  const need=(D.nopt||4)+4;
  const base=pool.length>=need?pool:C.filter(inR).length>=need?C.filter(inR):C;
  return{topic,diff,region,pool,base,nopt:D.nopt,rounds:10};
}
function weight(c,k){const s=S.c[c.code]||{};const m=s[k]||0;let w=m===0?(s.seen?3:2.5):m<2?2:m<4?1:.5;if(s.bad&&m<3)w+=1.5;return w}
function wpick(a,f){const ws=a.map(f);let r=Math.random()*ws.reduce((x,y)=>x+y,0);for(let i=0;i<a.length;i++){r-=ws[i];if(r<=0)return a[i]}return a[a.length-1]}
function capSet(c){return new Set([c.k,...c.a])}
function distractors(t,type,cfg){
  const m=TY[type],n=cfg.nopt-1,capLike=m.skill==='c',usesFlag=m.show==='flag'||m.opt==='flag';
  const acc=capSet(t);
  const valid=x=>x.code!==t.code&&!(capLike&&(x.nc||acc.has(x.k)||x.a.some(a=>acc.has(a))));
  const label=x=>m.opt==='cap'?x.k:m.opt==='name'?x.n:x.code;
  const same=shuffle(cfg.base.filter(x=>x.cont===t.cont&&valid(x)));
  const rest=shuffle(cfg.base.filter(valid));
  const mates=usesFlag?shuffle(CLUSTERS.filter(g=>g.includes(t.code)).flat().map(g=>BY[g]).filter(x=>x&&valid(x))):[];
  const order=cfg.diff==='lett'?rest:cfg.diff==='middels'?[...same.slice(0,2),...rest]:[...mates.slice(0,3),...same,...rest];
  const out=[],seen=new Set([label(t)]);
  for(const x of [...order,...shuffle(C.filter(valid))]){if(out.length>=n)break;const l=label(x);if(seen.has(l))continue;seen.add(l);out.push(x.code)}
  return out;
}
function makeQ(type,t,cfg){const q={type,code:t.code};if(!TY[type].typed)q.opts=shuffle([t.code,...distractors(t,type,cfg)]);return q}
function buildRound(cfg){
  const types=qTypes(cfg.topic,cfg.diff),used=new Set(),qs=[];
  for(let i=0;i<cfg.rounds;i++){
    const type=types[rnd(types.length)],m=TY[type];
    let cand=cfg.pool.filter(c=>!used.has(c.code)&&!(m.skill==='c'&&c.nc)&&!(cfg.diff==='lett'&&m.skill==='c'&&c.t));
    if(!cand.length)cand=cfg.pool.filter(c=>!(m.skill==='c'&&c.nc));
    const t=wpick(cand,c=>weight(c,m.skill));used.add(t.code);qs.push(makeQ(type,t,cfg));
  }
  return qs;
}
function checkTyped(txt,q){
  const c=BY[q.code],kind=TY[q.type].typed,x=nz(txt);if(!x)return{empty:true};
  const forms=o=>(kind==='name'?[o.n,...o.v]:[o.k,...o.a,...o.kv]).map(nz);
  const acc=forms(c);if(acc.includes(x))return{ok:true};
  if(C.some(o=>o!==c&&forms(o).includes(x)))return{ok:false};
  if(x.length>=6&&acc.some(a=>a.length>=6&&lev(a,x)<=1))return{ok:true,near:true};
  return{ok:false};
}

  ${R.badges.length?`<div style="text-align:left"><h3>Nye merker</h3>${R.badges.map(b=>`<div class="row" style="margin-top:8px"><span style="font-size:2rem">${b.e}</span><div><b>${b.n}</b><div class="small muted">${b.d} (+10 mynter)</div></div></div>`).join('')}</div>`:''}
  ${G.missed.length?`<div style="text-align:left"><h3>Øv mer på disse</h3><div class="stack" style="gap:8px;margin-top:8px">${G.missed.map(c=>`<button class="mini-c" data-act="card" data-v="${c}">${flag(c,'mini')}<div><b>${esc(BY[c].n)}</b><span class="small muted">${BY[c].nc?'':'Hovedstad: '+esc(BY[c].k)}</span></div></button>`).join('')}</div></div>`:''}</div>
  <button class="btn big full" data-act="again">Spill igjen</button><div class="grid2"><button class="btn sec" data-act="start">Nytt spill</button><button class="btn sec" data-act="home">Hjem</button></div></div>`;
}
function cellHtml(c){const t=tier(c.code),s=S.c[c.code]||{},seen=s.seen>0||S.op[c.code];
  const pips=(n,k)=>`<span class="pip" title="${k}">${[1,2,3,4].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span>`;
  return `<button class="cell t${t} ${seen?'seen':''}" data-act="card" data-v="${c.code}" aria-label="${seen?esc(c.n):'Ukjent land i '+CONT[c.cont].n}">${t?stampSvg(t):''}<div style="position:relative">${flag(c.code,seen?'':'blur')}${seen?'':'<div class="q">?</div>'}</div><div class="nm">${seen?esc(c.n):'Ukjent land'}</div>${seen?`<div class="pips">🏳️${pips(s.f||0,'Flagg')}${c.nc?'':`🏛️${pips(s.c||0,'Hovedstad')}`}</div>`:''}</button>`}
function gridHtml(){const q=nz(pp.q);let list=pp.cont==='ALL'||q?C:C.filter(c=>c.cont===pp.cont);
  if(q)list=list.filter(c=>{const s=S.c[c.code]||{};return(s.seen>0||S.op[c.code])&&(nz(c.n).includes(q)||nz(c.k).includes(q))});
  return list.length?list.map(cellHtml).join(''):'<div class="card center" style="grid-column:1/-1">Ingen oppdagede land funnet. Spill flere runder for å oppdage flere!</div>'}
function vPassport(){
  const tot=C.length,n=stamps();
  return topbar('Reisepass',{noBack:true})+`<div class="card" style="margin-bottom:12px"><div class="row"><h3 class="sp">${n} av ${tot} stempler</h3><span class="chip">${goldN()} gull</span></div><div class="meter" style="margin-top:8px"><i style="width:${n/tot*100}%"></i></div><div class="small muted" style="margin-top:6px;font-weight:700">Svar riktig på flagg og hovedsteder for å få bronse, sølv og gull. Gull krever at du kan både flagg og hovedstad.</div></div>
  <input id="srch" class="search" type="search" placeholder="Søk i landene du har oppdaget" aria-label="Søk" value="${esc(pp.q)}">
  <div class="tabs" role="tablist">${CONTS.map(k=>{const cs=C.filter(c=>c.cont===k);return `<button class="tab ${pp.cont===k&&!pp.q?'on':''}" role="tab" data-act="pcont" data-v="${k}">${CONT[k].n} ${cs.filter(c=>tier(c.code)>0).length}/${cs.length}</button>`}).join('')}</div>
  <div class="pgrid" id="pgrid">${gridHtml()}</div>`;
}
function vBadges(){
  const n=Object.keys(S.badges).length;
  return topbar('Merker',{noBack:true,right:`<span class="pill">${n}/${BADGES.length}</span>`})+`<div class="bgrid">${BADGES.map(b=>{const u=S.badges[b.id];return `<div class="card bd ${u?'':'lock'}"><div class="em">${b.e}</div><b>${b.n}</b><div class="small muted" style="font-weight:700">${b.d}</div>${u?'<div class="chip" style="margin-top:8px">Låst opp</div>':''}</div>`}).join('')}</div>`;
}
const AVS=[['🦊',0],['🐼',0],['🐸',0],['🐯',40],['🦁',40],['🐧',40],['🐰',40],['🐢',40],['🐙',60],['🐨',60],['🦉',60],['🦄',80],['🦖',100],['🐬',60],['🦒',80]];
const SKINS=[['hav','Havet',0,'#2aa4f4,#1457c8'],['regn','Regnskogen',60,'#35cf84,#0b7653'],['sol','Solnedgang',80,'#ff9b5e,#c8325f'],['rom','Verdensrommet',100,'#6b5dff,#1b1357']];
function vShop(){
  return topbar('Butikk',{noBack:true,right:`<span class="pill">${coinSvg}${S.coins}</span>`})+`<div class="stack"><div class="card stack"><h3>Venner</h3><div class="shopg">${AVS.map(([a,p])=>{const own=S.own.av.includes(a);return `<button class="si ${S.avatar===a?'sel':''}" data-act="buyav" data-v="${a}" aria-label="${a} ${own?(S.avatar===a?'valgt':'bruk'):'kjøp for '+p}"><span class="em">${a}</span><small>${S.avatar===a?'Valgt':own?'Bruk':'🪙 '+p}</small></button>`}).join('')}</div></div>
  <div class="card stack"><h3>Bakgrunner</h3><div class="shopg">${SKINS.map(([k,n,p,g])=>{const own=S.own.sk.includes(k);return `<button class="si ${S.skin===k?'sel':''}" data-act="buysk" data-v="${k}" aria-label="${n}"><div class="skin" style="background:linear-gradient(180deg,${g.split(',')[0]},${g.split(',')[1]})"></div>${n}<small>${S.skin===k?'Valgt':own?'Bruk':'🪙 '+p}</small></button>`}).join('')}</div></div>
  <div class="card soft small" style="font-weight:700">Tjen mynter ved å svare riktig, få stjerner, fullføre dagens oppdrag og låse opp merker.</div></div>`;
}
function vSettings(){
  return topbar('Innstillinger')+`<div class="stack"><div class="card stack"><label for="nm" style="font-weight:800">Navn</label><input id="nm" class="txt" maxlength="14" autocomplete="off" value="${esc(S.name)}">
  <button class="switch" data-act="snd" aria-pressed="${S.snd}"><span>Lyd</span><i></i></button>
  <button class="switch" data-act="spk" aria-pressed="${S.speak}"><span>Les opp svaret automatisk</span><i></i></button></div>
  <div class="card stack"><h3>Slik fungerer det</h3><div class="small" style="font-weight:700">Hver runde har 10 spørsmål. Du får opptil tre stjerner. Feil svar kommer tilbake senere i runden, slik at du får øvd. Reisepasset gir bronse-, sølv- og gullstempel for hvert land. Fremgangen lagres i denne nettleseren på denne enheten.<br><br>Landene er de 193 medlemmene i FN, pluss Vatikanstaten. Noen land har flere hovedsteder, og da godtar spillet begge og forklarer.</div></div>
  <button class="btn bad" data-act="resetq">Nullstill all fremgang</button></div>`;
}
/* ================= Kort / modaler ================= */
function cardModal(code){
  const c=BY[code],s=S.c[code]||{f:0,c:0},t=tier(code);
  if(!S.op[code]){S.op[code]=1;const sc=sk(code);sc.seen=Math.max(sc.seen,1);save();const nb=checkBadges();if(nb.length){save();setTimeout(()=>toast(`Nytt merke: ${nb[0].e} ${nb[0].n}`),300)}}
  const pips=n=>[1,2,3,4].map(i=>`<i style="display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;background:${i<=n?'var(--ok)':'var(--line)'}"></i>`).join('');
  return `<div class="modal" data-act="closeModal"><div role="dialog" aria-modal="true" aria-label="${esc(c.n)}" data-stop="1"><div class="row" style="margin-bottom:10px"><span class="chip">${CONT[c.cont].e} ${CONT[c.cont].n}</span><span class="sp"></span>${t?`<span class="chip">${TIERN[t]}stempel</span>`:''}<button class="icon-btn" data-act="closeModal" aria-label="Lukk">${ic('close')}</button></div>
  <div class="bigflag">${flag(code)}</div><h2 style="margin-top:14px">${esc(c.n)}</h2>${c.nc?'':`<div style="font-weight:800;font-size:1.15rem">Hovedstad: ${esc(c.k)}</div>`}
  <div class="row" style="margin:8px 0 4px"><button class="btn sec sm" data-act="saycard" data-v="${code}">${ic('speaker','sm')}Lytt</button></div>
  ${(c.note||c.fact)?`<div class="card soft" style="margin-top:10px;font-weight:700">💡 ${esc(c.note?c.note:c.fact)}${c.note&&c.fact?'<br><br>'+esc(c.fact):''}</div>`:''}
  <div class="small" style="margin-top:12px;font-weight:800">Flagg ${pips(s.f||0)}</div>${c.nc?'':`<div class="small" style="margin-top:4px;font-weight:800">Hovedstad ${pips(s.c||0)}</div>`}</div></div>`;
}
const confirmModal=(t,msg,yes,no,act)=>`<div class="modal mid"><div role="dialog" aria-modal="true"><h2>${t}</h2><p style="font-weight:700">${msg}</p><div class="stack"><button class="btn ok full" data-act="closeModal">${no}</button><button class="btn bad full" data-act="${act}">${yes}</button></div></div></div>`;
/* ================= Spillflyt ================= */
function startGame(cfg0){
  const cfg=prepCfg(cfg0.topic,cfg0.diff,cfg0.region);S.last={topic:cfg.topic,diff:cfg.diff,region:cfg.region};save();
  const qs=buildRound(cfg);
  G={cfg,queue:qs.slice(),qi:0,q:qs[0],done:0,ok:0,combo:0,best:0,xp:0,coins:0,missed:[],before:{},answered:false,sel:null,t0:Date.now(),n:0,last:false,typed:'',xp0:S.xp,fastN:0};
  stack=[];view={n:'game',p:{}};modal='';render();window.scrollTo(0,0);
}
function finishAnswer(ok,opts={}){
  const q=G.q,c=BY[q.code],m=TY[q.type],secs=(Date.now()-G.t0)/1000;
  const r={ok,near:!!opts.near};q.result=r;G.answered=true;G.n++;
  if(!(q.code in G.before))G.before[q.code]=tier(q.code);
  const s=sk(q.code);s.seen=Math.max(1,s.seen||0);
  touchDay();
  if(!q.retry){
    G.done++;
    if(ok){s[m.skill]=Math.min(4,(s[m.skill]||0)+(q.hinted?0:1));G.ok++;G.combo++;G.best=Math.max(G.best,G.combo);S.st.ok++;S.st[m.skill==='f'?'fok':'cok']++;
      let xp=10;if(secs<5&&!q.hinted){xp+=5;r.bonus=true;S.st.fast++}xp+=Math.min(G.combo,5)*2-2;if(G.combo<2)xp=Math.min(xp,15);G.xp+=xp;S.xp+=xp;G.coins+=2;S.coins+=2;S.st.maxCombo=Math.max(S.st.maxCombo,G.best);
      if(missionAdd(m.skill==='f'?'flag':'cap')){setTimeout(()=>toast('Dagens oppdrag fullført! +15 mynter'),400);G.mission=true}}
    else{s[m.skill]=Math.max(0,(s[m.skill]||0)-1);s.bad=(s.bad||0)+1;S.st.bad++;G.combo=0;if(!G.missed.includes(q.code))G.missed.push(q.code);
      const rq={...q,retry:true,result:null,hinted:false,hintOn:false,gone:null};if(rq.opts)rq.opts=shuffle(rq.opts);G.queue.splice(Math.min(G.qi+4,G.queue.length),0,rq)}
  }else{if(ok){G.coins+=1;S.coins+=1;S.xp+=3;G.xp+=3}else G.combo=0}
  G.last=G.qi+1>=G.queue.length;
  save();
  if(ok){sfx.ok();if(G.combo>0&&G.combo%5===0&&!q.retry){confetti(24);}}else sfx.bad();
  if(navigator.vibrate)try{navigator.vibrate(ok?15:[40,40,40])}catch(e){}
  if(S.speak&&!c.nc)say(`${c.n}. Hovedstaden er ${c.k}`);else if(S.speak)say(c.n);
}
function nextQ(){
  if(G.last){return finishRound()}
  G.qi++;G.q=G.queue[G.qi];G.answered=false;G.sel=null;G.typed='';G.t0=Date.now();render();window.scrollTo(0,0);
}
function finishRound(){
  const ok=G.ok,stars=ok>=9?3:ok>=7?2:ok>=5?1:0;
  const l0=lvl(G.xp0);
  const bx=20+stars*10,bc=stars*5;S.xp+=bx;S.coins+=bc;G.xp+=bx;G.coins+=bc;
  S.st.rounds++;if(ok===G.cfg.rounds)S.st.perfect++;if(G.cfg.diff==='mester'&&ok>=7)S.st.mester++;
  const mis=missionAdd('round');const l1=lvl(S.xp);if(l1>l0)S.coins+=20;
  const newStamps=Object.keys(G.before).map(c=>[c,tier(c)]).filter(([c,t])=>t>G.before[c]);
  const nb=checkBadges();save();
  G.res={stars,xp:G.xp,coins:G.coins+(l1>l0?20:0)+nb.length*10,level:l1>l0?l1:0,mission:mis||G.mission,newStamps,badges:nb};
  if(!G.missed.length&&false)G.missed=[];
  stack=[];view={n:'result',p:{}};render();window.scrollTo(0,0);
  if(stars>=2){sfx.win();confetti(60)}else sfx.tap();
}
function choose(code){
  if(G.answered)return;G.sel=code;const ok=code===G.q.code;finishAnswer(ok);render();
  if(!ok){const b=app.querySelector('.opt.bad');if(b)b.classList.add('shake')}
}
function submitTyped(){
  if(G.answered)return;const inp=document.getElementById('ans');if(!inp)return;
  const r=checkTyped(inp.value,G.q);if(r.empty){inp.focus();return}
  G.typed=inp.value;finishAnswer(!!r.ok,{near:r.near});render();
}
function useHint(){
  const q=G.q;if(G.answered||q.hinted||S.coins<2)return;S.coins-=2;q.hinted=true;
  if(q.opts){const wrong=q.opts.filter(o=>o!==q.code);const rm=shuffle(wrong).slice(0,q.opts.length>=4?2:1);q.gone=rm}else q.hintOn=true;
  save();render();
}
/* ================= Hendelser ================= */
const ACT={
tab(d){sfx.tap();tab(d.n)},back(){back()},home(){tab('home')},
start(){sfx.tap();setup={topic:null,diff:null,step:1};go('setup')},
again(){if(S.last)startGame(S.last);else ACT.start()},
topic(d){setup.topic=d.v;setup.step=2;render()},
diff(d){setup.diff=d.v;setup.step=3;render()},
region(d){startGame({topic:setup.topic,diff:setup.diff,region:d.v})},
pick(d){choose(d.v)},hint(){useHint()},
next(){sfx.tap();nextQ()},
quit(){modal=confirmModal('Avslutte runden?','Fremgangen i denne runden går tapt.','Avslutt','Fortsett å spille','quitok')},
quitok(){G=null;tab('home')},
closeModal(){modal='';render()},
say(){const c=BY[G.q.code];say(c.nc?c.n:`${c.n}. Hovedstaden er ${c.k}`)},
saycard(d){const c=BY[d.v];say(c.nc?c.n:`${c.n}. Hovedstaden er ${c.k}`)},
card(d){modal=cardModal(d.v);render()},
daycard(){modal=cardModal(dayCountry().code);render();const nb=0},
pcont(d){pp.cont=d.v;pp.q='';render()},
settings(){go('settings')},
snd(){S.snd=!S.snd;save();render()},spk(){S.speak=!S.speak;save();render()},
resetq(){modal=confirmModal('Nullstille alt?','Alle stempler, merker, mynter og nivåer slettes. Dette kan ikke angres.','Ja, slett alt','Nei, behold','resetok')},
resetok(){S=defaults();S.intro=false;save();applySkin();stack=[];view={n:'intro',p:{}};modal='';setup={};render()},
av0(d){const n=document.getElementById('nm');if(n)S.name=n.value;setup.av=d.v;render()},
'intro-ok'(){const n=document.getElementById('nm');S.name=(n.value||'').trim().slice(0,14)||'Reisende';S.avatar=setup.av||'🦊';S.intro=true;save();sfx.win();tab('home');confetti(30)},
buyav(d){const a=d.v,p=AVS.find(x=>x[0]===a)[1];if(S.own.av.includes(a)){S.avatar=a;save();render();return}if(S.coins<p){toast(`Du trenger ${p-S.coins} mynter til`);return}S.coins-=p;S.own.av.push(a);S.avatar=a;const nb=checkBadges();save();sfx.win();confetti(20);render();if(nb.length)toast(`Nytt merke: ${nb[0].e} ${nb[0].n}`)},
buysk(d){const k=d.v,p=SKINS.find(x=>x[0]===k)[2];if(S.own.sk.includes(k)){S.skin=k;save();applySkin();render();return}if(S.coins<p){toast(`Du trenger ${p-S.coins} mynter til`);return}S.coins-=p;S.own.sk.push(k);S.skin=k;const nb=checkBadges();save();applySkin();sfx.win();confetti(20);render();if(nb.length)toast(`Nytt merke: ${nb[0].e} ${nb[0].n}`)}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('modal')&&e.target!==t)return;
  if(t.tagName==='FORM')return;
  const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset)}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.act==='submit')submitTyped()});
document.addEventListener('input',e=>{
  if(e.target.id==='srch'){pp.q=e.target.value;const g=document.getElementById('pgrid');if(g)g.innerHTML=gridHtml();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',!pp.q&&b.dataset.v===pp.cont))}
  if(e.target.id==='nm'&&view.n==='settings'){S.name=e.target.value.slice(0,14);save()}
});
document.addEventListener('keydown',e=>{
  if(view.n!=='game'||!G)return;
  if(modal)return;
  if(e.key==='Enter'&&G.answered){e.preventDefault();nextQ();return}
  if(!G.answered&&G.q.opts&&/^[1-9]$/.test(e.key)){const o=G.q.opts[+e.key-1];if(o&&!(G.q.gone||[]).includes(o)){e.preventDefault();choose(o)}}
});
/* ================= Start ================= */
applySkin();ensureMission();
view=S.intro?{n:'home',p:{}}:{n:'intro',p:{}};
render();

</script></body></html>
